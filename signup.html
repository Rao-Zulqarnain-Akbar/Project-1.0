<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up page</title>
    <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-gray-200 flex justify-center min-h-screen">

    <div class="bg-white w-96 p-8 rounded-3xl shadow-lg">

        <div class="flex justify-center">
            <div class="w-16 h-16 bg-violet-200 rounded-xl flex items-center justify-center">
                <span class="text-3xl font-bold text-violet-600">ZA</span>
            </div>
        </div>

        <h1 class="text-4xl font-bold text-center mt-6">
            Create your account
        </h1>

        <p class="text-center text-gray-600 mt-2">
            Sign up to get started with us
        </p>

        <form class="mt-8">

            <label class="font-semibold">Full Name</label>
            <div class="flex items-center border rounded-xl px-3 mt-2 mb-5">
            <input type="text" placeholder="Enter your full name" class="w-full p-3 outline-none">
            </div>

            <label class="font-semibold">Email</label>
            <div class="flex items-center border rounded-lg px-3 mt-2 mb-5">
            <input type="email" placeholder="Enter your email" class="w-full p-3 outline-none">
            </div>

            <label class="font-semibold">Password</label>
            <div class="flex items-center border rounded-lg px-3 mt-2 mb-5">
            <input type="password" placeholder="Enter a password" class="w-full p-3 outline-none">
            </div>

            <label class="font-semibold">Confirm Password</label>
            <div class="flex items-center border rounded-lg px-3 mt-2 mb-6">
            <input type="password" placeholder="Confirm your password" class="w-full p-3 outline-none">
            </div>

            <button
            class="w-full bg-violet-600 text-white py-3 rounded-lg cursor-pointer">
                Sign Up
            </button>
        </form>

        <div class="flex items-center my-6">
            <span class="mx-3 text-gray-500 justify-center ml-25">------ or ------</span>
        </div>

        <p class="text-center text-gray-500">
            Already have an account?
            <a href="index.html" class="text-violet-600 font-semibold">
                Login
            </a>
        </p>

    </div>

</body>

</html>
