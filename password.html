<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-gray-200 flex  justify-center min-h-screen p-4">

  <div class="relative bg-white w-full max-w-2xl rounded-2xl shadow-lg p-6 sm:p-8 md:p-12">

    <div class="text-center">
      <h1 class="text-3xl sm:text-4xl font-bold text-gray-900">
        Forgot Password
      </h1>
      <p class="mt-3 text-gray-500 text-sm sm:text-base">
        Enter your registered email address.
      </p>
    </div>

    <form class="mt-10">

      <label class="mb-2 text-sm font-medium text-gray-700">
        <a href="">Email Address</a></label>
      <input type="email" placeholder="Enter your email" class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:border-indigo-600" >

      <button type="submit" class="w-full cursor-pointer mt-6 bg-purple-600 hover:bg-indigo-700 text-white py-3 rounded-md font-medium transition">

        <a href="resetpass.html">Continue</a>
      </button>

    </form>

    <div class="flex items-center my-6">
      <div class="flex-1 border-t"></div>
      <span class="mx-4 text-gray-400 text-sm">or</span>
      <div class="flex-1 border-t"></div>
    </div>

    <button  class="w-full cursor-pointer border border-indigo-600 text-indigo-600 py-3 rounded-md font-medium hover:bg-indigo-50 transition">
     <a href="index.html"> Back to Login</a>
    </button>
  </div>

</body>
</html>
