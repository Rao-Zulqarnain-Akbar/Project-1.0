<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reset password</title>
    <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

  <div class="relative bg-white w-full max-w-2xl rounded-2xl shadow-lg p-6 sm:p-8 md:p-12">

    <div class="text-center">
      <h1 class="text-3xl sm:text-4xl font-bold text-gray-900">
        Reset Password
      </h1>
      <p class="mt-3 text-gray-500 text-sm sm:text-base">
        Create a new password for your account.
      </p>
    </div>

    <form action="login.html" class="mt-10">

      <div class="mb-5">
        <label class="block mb-2 text-sm font-medium text-gray-700">New Password</label>
        <input type="password" placeholder="Enter new password" class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:border-indigo-600">
      </div>

      <div>
        <label class="block mb-2 text-sm font-medium text-gray-700">Confirm Password</label>
        <input type="password" placeholder="Confirm your password" class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:border-indigo-600">
      </div>

      <button type="submit" class="w-full cursor-pointer mt-6 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-md font-medium transition"> <a href="otp.html">Reset Password</a>
      </button>

    </form>

    <div class="flex items-center my-6">
      <div class="flex-1 border-t border-gray-300"></div>
      <span class="mx-4 text-gray-400 text-sm">or</span>
      <div class="flex-1 border-t border-gray-300"></div>
    </div>

    <a href="index.html"
       class="block w-full text-center border border-indigo-600 text-indigo-600 py-3 rounded-md font-medium hover:bg-indigo-50 transition">Back to Login
    </a>

  </div>

</body>
</html>
