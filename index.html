<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-gray-200 flex justify-center items-center min-h-screen">

    <div class="bg-white w-90%  rounded-2xl shadow-lg p-8 mb-5">

        <div class="flex justify-center mb-5">
            <div class="bg-purple-200 w-16 h-16 p-4 rounded-xl">
            <span class="text-3xl font-bold text-violet-600">ZA</span>
            </div>
        </div>

        <h1 class="text-xl font-semibold md:text-4xl md:font-bold lg:text-5xl lg:font-extrabold text-center text-gray-800">
            Welcome back
       </h1>

        <p class="text-center text-gray-500 mt-2 mb-8">
            Login to your account
        </p>

        <label class="font-semibold text-gray-700"> Email</label>
        <div class="border rounded-lg flex items-center px-3 py-3 mt-2 mb-6">
        <input type="email" placeholder="Enter your email" class="ml-3 w-full outline-none">
        </div>

        <label class="font-semibold text-gray-700">Password</label>
        <div class="border rounded-lg flex items-center px-3 py-3 mt-2">
        <input type="password" placeholder="Enter your password" class="ml-3 w-full outline-none">
        </div>

        <div class="mt-3 mb-8">
            <a href="password.html" class="text-purple-600">
                Forgot password?
            </a>
        </div>

        <button
            class="w-full bg-purple-600 text-white py-3 rounded-lg cursor-pointer">Login</button>

        <div class="flex items-center my-8">
        <span class="mx-3 text-gray-500 justify-center ml-17">------ or ------</span>
        </div>

        <p class="text-center text-gray-600">
            Don't have an account?
            <a href="signup.html" class="text-purple-600 font-semibold hover:underline">Sign up</a>

        </p>

    </div>

</body>
</html>
